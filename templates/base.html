<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
        <meta name="description" content="Mindscape - Daily self-reflection through thoughtful questions. Discover yourself one answer at a time." />
        <meta name="author" content="Tamami" />
        <meta name="keywords" content="self-reflection, personal growth, daily questions, journaling, self-discovery, mindfulness, mindscape" />
        
        <!-- Open Graph Meta Tags -->
        <meta property="og:title" content="{% block og_title %}Mindscape - Self-reflection through daily questions{% endblock %}" />
        <meta property="og:description" content="{% block og_description %}Discover yourself through daily questions. Create a personal journal of your thoughts and growth over time.{% endblock %}" />
        <meta property="og:type" content="website" />
        <meta property="og:url" content="{{ request.url }}" />
        
        <!-- Twitter Card Meta Tags -->
        <meta name="twitter:card" content="summary" />
        <meta name="twitter:title" content="{% block twitter_title %}Mindscape - Self-reflection{% endblock %}" />
        <meta name="twitter:description" content="{% block twitter_description %}Daily questions for self-discovery and personal growth{% endblock %}" />
        
        <title>{% block title %}{% endblock %}</title>
        
        <!-- Favicon -->
        <link rel="icon" type="image/x-icon" href="{{ url_for('static', filename='assets/favicon.ico') }}" />
        
        <!-- External CSS -->
        <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.5.0/font/bootstrap-icons.css" rel="stylesheet" />
        <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
        
        <!-- Custom CSS -->
        <link href="{{ url_for('static', filename='css/styles.css') }}" rel="stylesheet" />
        
        <!-- Structured Data -->
        <script type="application/ld+json">
        {
            "@context": "https://schema.org",
            "@type": "WebSite",
            "name": "Mindscape",
            "description": "Self-reflection through daily questions",
            "url": "{{ request.url_root }}"
        }
        </script>
    </head>
    <body>
        <!-- Toast Container -->
        <div class="toast-container position-fixed top-0 end-0 p-3">
            <div id="toastMessage" class="toast align-items-center position-relative" role="alert" aria-live="assertive" aria-atomic="true">
                <div class="toast-body" id="toastBodyContent"></div>
                <button type="button" class="btn-close position-absolute top-0 end-0 m-2" data-bs-dismiss="toast" aria-label="Close"></button>
            </div>
        </div>
        
        <!-- Navigation -->
        <nav class="navbar navbar-light bg-white border-bottom fixed-top">
            <div class="container">
                <a class="navbar-brand" href="{{ url_for('home') }}">
                    <img height="25" src="{{ url_for('static', filename='assets/img/person-arms-up.svg') }}" alt="Mindscape Logo"> 
                    Mindscape
                </a>
                <div class="d-flex align-items-center">
                    {% if not logged_in %}
                    <div class="btn-group" role="group">
                        <a class="btn btn-dark" href="{{ url_for('register') }}">Sign Up</a>
                        <a class="btn btn-outline-dark" href="{{ url_for('login') }}">Login</a>
                    </div>
                    {% endif %}
                    {% if logged_in %}
                    <div class="profile-dropdown">
                        <img src="{{ url_for('static', filename='assets/img/default_user.svg') }}" alt="Profile" class="profile-image default-user-image" onclick="toggleProfileDropdown()">
                        <div class="profile-dropdown-menu" id="profileDropdown">
                            <a href="{{ url_for('mypage') }}" class="profile-dropdown-item">
                                <i class="bi bi-person me-2"></i>My Page
                            </a>
                            <a href="{{ url_for('logout') }}" class="profile-dropdown-item">
                                <i class="bi bi-box-arrow-right me-2"></i>Logout
                            </a>
                        </div>
                    </div>
                    {% endif %}
                </div>  
            </div>
        </nav>
        
        <!-- Main Content -->
        {% block content %}
        {% endblock %}
        
        <!-- Footer -->
        <footer class="call-to-action text-white text-center" id="signup">
            <div class="container position-relative">
                <div class="row">
                    <div class="col-lg-6 h-100 text-center text-lg-start my-2">
                        <p>
                            <a class="link-dark" href="{{ url_for('about') }}">About</a>
                            <span class="text-dark"> | </span>
                            <a class="link-dark" href="{{ url_for('help') }}">FAQs</a>
                            <span class="text-dark"> | </span>
                            <a class="link-dark" href="{{ url_for('contact') }}">Contact</a>
                            <span class="text-dark"> | </span>
                            <a class="link-dark" href="{{ url_for('terms_of_use') }}">Terms of Use</a>
                        </p>
                        <p class="small mb-4 mb-lg-0 text-dark">
                            &copy; Mindscape {{ current_year }}. All Rights Reserved.
                        </p>
                    </div>
                </div>
            </div>
        </footer>
        
        <!-- JavaScript -->
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>
        <script src="{{ url_for('static', filename='js/init.js') }}"></script>
        <script src="{{ url_for('static', filename='js/scripts.js') }}"></script>
        
        <!-- Flask Data Integration -->
        <script>
            (function() {
                // Flash Messages
                {% with messages = get_flashed_messages() %}
                    {% if messages %}
                        MindscapeInit.showFlashMessages({{ messages | tojson }});
                    {% endif %}
                {% endwith %}
                
                // Temp Password Warning
                {% if logged_in and current_user.is_using_temp_password %}
                    MindscapeInit.setTempPasswordFlag(true);
                    MindscapeInit.showTempPasswordWarning();
                {% endif %}
            })();
        </script>
    </body>
</html>
